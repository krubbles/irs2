[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irs-v2"
version = "0.1.0"
description = "Multi-city IRS datasets and neural channel estimation with phase optimization"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "torch>=2.5"]

[project.optional-dependencies]
generation = ["deepmimo==4.0.3", "sionna-rt==2.0.1", "scipy>=1.14"]
dev = ["mypy>=1.11", "ruff>=0.8", "pytest>=8"]

[project.scripts]
irs = "irs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
irs = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
untyped_calls_exclude = ["torch"]
files = ["src/irs", "tests"]

[[tool.mypy.overrides]]
module = ["deepmimo.*", "sionna.*", "mitsuba.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
